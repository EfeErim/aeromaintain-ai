name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/python311-tested.txt

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/python311-tested.txt -e ".[dev,ncmapss]"

      - name: Dependency check
        run: |
          python -m pip check

      - name: Raw-data exclusion
        shell: bash
        run: |
          tracked="$(git ls-files data/raw data/processed artifacts runs)"
          if [ -n "$tracked" ]; then
            echo "Generated or raw data is tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Tests and coverage
        run: pytest --cov=src/aeromaintain --cov-report=term-missing --cov-fail-under=80
