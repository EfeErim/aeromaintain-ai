name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the v5 lock is also checked against the v1.0.0 tag.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/python311-tested.txt

      - run: python -m pip install -c constraints/python311-tested.txt -e ".[dev,ncmapss]"
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=src/aeromaintain --cov-report=term-missing
      - name: Synthetic end-to-end run
        run: aeromaintain pipeline --synthetic --run-id ci-synthetic --project-root "$RUNNER_TEMP/synthetic"

  hosted-demo:
    # The hosted demo installs only requirements.txt; render it from exactly that.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_demo.py
