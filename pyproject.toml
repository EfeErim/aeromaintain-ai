[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aeromaintain-ai"
version = "1.0.0"
description = "Remaining-useful-life prediction for turbofan engines on NASA C-MAPSS and N-CMAPSS, with prediction intervals and maintenance alarms"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Efe Erim" }]
dependencies = [
  "joblib>=1.4.2",
  "numpy>=1.26.4",
  "pandas>=2.2.3",
  "plotly>=5.24.1",
  "pyarrow>=18.1.0",
  "pydantic>=2.10.4",
  "PyYAML>=6.0.2",
  "scikit-learn>=1.6.0",
  "shap>=0.46.0",
  "streamlit>=1.41.1",
  "typer>=0.15.1",
  "xgboost>=2.1.3",
]

[project.optional-dependencies]
ncmapss = [
  "h5py>=3.11",
]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.2",
]
lstm = [
  "torch>=2.5",
]

[project.scripts]
aeromaintain = "aeromaintain.cli:app"

[project.urls]
Homepage = "https://aeromaintain-ai-demo.streamlit.app/"
Repository = "https://github.com/EfeErim/aeromaintain-ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
