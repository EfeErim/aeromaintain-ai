[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aeromaintain-ai"
version = "0.1.0"
description = "Educational RUL prediction and synthetic maintenance scheduling prototype"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "EfeErim" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "joblib>=1.4.2",
  "numpy>=1.26.4",
  "ortools>=9.11.4210",
  "pandas>=2.2.3",
  "plotly>=5.24.1",
  "pyarrow>=18.1.0",
  "pydantic>=2.10.4",
  "PyYAML>=6.0.2",
  "scikit-learn>=1.6.0",
  "shap>=0.46.0",
  "streamlit>=1.41.1",
  "typer>=0.15.1",
  "xgboost>=2.1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.2",
]

[project.scripts]
aeromaintain = "aeromaintain.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["aeromaintain"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
